[project]
name = "weather-bench"
version = "0.1.0"
description = "Micro-benchmark comparing polars, numpy, and duckdb (newbie vs pro) on a small weather pipeline"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=1.1.0",
    "numpy>=2.1.0",
    "polars>=1.20.0",
    "psutil>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_bench"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Mirrors sibling project: small, deliberate rule set.
#   E, W — pycodestyle | F — pyflakes | I — isort | UP — pyupgrade
#   B — bugbear | SIM — simplify | ANN — annotations (ANN401 bans Any)
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
# Tests and benchmarks may stay annotation-light; engine internals and the
# contract deliberately use Any for opaque per-engine pipeline state — the
# whole point of the contract is that the state type is hidden from the harness.
"tests/**" = ["ANN"]
"src/weather_bench/common/contract.py" = ["ANN401"]
"src/weather_bench/engines/**" = ["ANN401"]
# matplotlib's pyplot is untyped; passing it as Any to chart helpers is fine.
"src/weather_bench/report/charts.py" = ["ANN401"]

[tool.pytest.ini_options]
# pytest-benchmark is invalid under xdist parallelism — force serial.
# Benchmarks are excluded from the default run; `make bench` runs them explicitly.
addopts = ["-ra", "-p", "no:xdist", "-m", "not benchmark"]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "benchmark: timing benchmarks (run serially, no xdist)",
]

[dependency-groups]
dev = [
    "pyrefly>=1.0.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]
bench = [
    "matplotlib>=3.9.0",
    "pytest-benchmark>=5.0.0",
]
